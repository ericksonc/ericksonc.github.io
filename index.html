<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <title>Omnica — See what all your agents are doing</title>
    <meta
      name="description"
      content="Manage your agents, don't babysit them. See what's running, see what's waiting on you, see what got delivered. Omnica is in closed beta."
    />

    <link rel="canonical" href="https://omnica.ai/" />
    <!-- sRGB equivalent of the --d-bg token, oklch(15% 0.014 250) -->
    <meta name="theme-color" content="#070c11" />
    <meta name="color-scheme" content="dark" />

    <link rel="icon" type="image/png" sizes="32x32" href="/brand/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/brand/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/brand/icon-180.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Omnica" />
    <meta property="og:url" content="https://omnica.ai/" />
    <meta property="og:title" content="Omnica — See what all your agents are doing" />
    <meta
      property="og:description"
      content="Manage your agents, don't babysit them. See what's running, see what's waiting on you, see what got delivered. Omnica is in closed beta."
    />
    <meta property="og:image" content="https://omnica.ai/brand/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- tokens.css pulls both families over @import; warm the connections early -->
    <link rel="preconnect" href="https://api.fontshare.com" crossorigin />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
